# Host configuration, installed separately from the backend container releases.
server {
    listen 80;
    listen [::]:80;
    server_name caloricaitmo.duckdns.org;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/calorica-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://caloricaitmo.duckdns.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name caloricaitmo.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/caloricaitmo.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caloricaitmo.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    access_log off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_cache off;
    }
}
