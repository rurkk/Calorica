name: Backend checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: calorica_test
          POSTGRES_USER: calorica
          POSTGRES_PASSWORD: ci-test-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U calorica -d calorica_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/calorica_test
      DB_USERNAME: calorica
      DB_PASSWORD: ci-test-only
      POSTGRES_DB: calorica_stand_check
      POSTGRES_USER: calorica
      POSTGRES_PASSWORD: ci-test-only
      API_PORT: '18090'
      DB_POOL_SIZE: '2'
      BACKEND_IMAGE: calorica-backend:check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon check bootJar
        working-directory: backend
      - name: Build and smoke test the constrained stand
        run: |
          docker build -t calorica-backend:check backend
          compose() { docker compose -p calorica-stand-check -f deploy/backend/compose.yml "$@"; }
          compose up -d --wait --wait-timeout 150
          wait_for_backend() {
            for attempt in {1..90}; do
              if curl -fsS --max-time 10 "http://localhost:$API_PORT/actuator/health/readiness"; then return; fi
              if [ "$attempt" = 90 ]; then return 1; fi
              sleep 2
            done
          }
          wait_for_backend
          python3 - <<'PY'
          import concurrent.futures
          import os
          import urllib.request

          url = f"http://localhost:{os.environ['API_PORT']}/actuator/health/readiness"
          def check(_):
              with urllib.request.urlopen(url, timeout=10) as response:
                  assert response.status == 200
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              list(executor.map(check, range(100)))
          PY
          compose restart backend
          wait_for_backend
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$API_PORT/api/products")" = 401
          compose stop db
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$API_PORT/actuator/health/readiness")" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$API_PORT/actuator/health/liveness")" = 200
          compose start db
          wait_for_backend
          docker inspect "$(compose ps -q backend)" "$(compose ps -q db)" | python3 -c '
          import json, sys
          for container in json.load(sys.stdin):
              assert not container["State"]["OOMKilled"], container["Name"]
              assert container["RestartCount"] == 0, container["Name"]
          '
      - name: Remove the disposable stand
        if: always()
        run: docker compose -p calorica-stand-check -f deploy/backend/compose.yml down --volumes
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: backend/build/reports/tests/
