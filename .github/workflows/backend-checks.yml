name: Backend checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: calorica_test
          POSTGRES_USER: calorica
          POSTGRES_PASSWORD: ci-test-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U calorica -d calorica_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/calorica_test
      DB_USERNAME: calorica
      DB_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon check bootJar
        working-directory: backend
      - name: Build and smoke test runtime container
        run: |
          docker build -t calorica-backend:check backend
          docker run -d --name calorica-backend-check --network host \
            -e DB_URL -e DB_USERNAME -e DB_PASSWORD calorica-backend:check
          wait_for_backend() {
            for attempt in {1..90}; do
              if curl -fsS --max-time 10 http://localhost:8080/actuator/health/readiness; then return; fi
              if [ "$attempt" = 90 ]; then return 1; fi
              sleep 2
            done
          }
          wait_for_backend
          docker restart calorica-backend-check
          wait_for_backend
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/products)" = 401
          docker stop '${{ job.services.postgres.id }}'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health/readiness)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health/liveness)" = 200
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: backend/build/reports/tests/
