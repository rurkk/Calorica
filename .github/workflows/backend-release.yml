name: Backend container release and Render deploy
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: calorica-backend-release
  cancel-in-progress: false
jobs:
  current:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: source
        name: Skip a superseded backend revision
        run: |
          git fetch origin main
          current=$(git log -1 --format=%H "$GITHUB_SHA" -- backend deploy/backend ':(exclude)**/*.md')
          latest=$(git log -1 --format=%H origin/main -- backend deploy/backend ':(exclude)**/*.md')
          if [ "$current" = "$latest" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'Skipped superseded backend revision; rerun the newest successful main workflow if needed.' >> "$GITHUB_STEP_SUMMARY"
          fi
  publish:
    needs: current
    if: needs.current.outputs.publish == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse an existing commit image on rerun
        id: existing
        run: |
          tag="ghcr.io/${GITHUB_REPOSITORY,,}-backend:sha-$GITHUB_SHA"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          error=$(mktemp)
          if docker buildx imagetools inspect "$tag" > /dev/null 2> "$error"; then
            digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          elif ! grep -Eq '(: not found|manifest unknown|MANIFEST_UNKNOWN)' "$error"; then
            cat "$error" >&2
            echo 'Registry lookup failed; refusing to overwrite an unknown existing release.' >&2
            exit 1
          fi
          rm -f "$error"
      - uses: docker/build-push-action@v6
        id: build
        if: steps.existing.outputs.digest == ''
        with:
          context: backend
          push: true
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Calorica backend
          tags: ${{ steps.existing.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: image
        env:
          TAG: ${{ steps.existing.outputs.tag }}
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image=${TAG%:*}@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published backend: ${TAG%:*}@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: backend-production
    concurrency:
      group: calorica-render-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Skip a superseded backend deployment
        id: source
        run: |
          git fetch origin main
          current=$(git log -1 --format=%H "$GITHUB_SHA" -- backend deploy/backend ':(exclude)**/*.md')
          latest=$(git log -1 --format=%H origin/main -- backend deploy/backend ':(exclude)**/*.md')
          if [ "$current" = "$latest" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipped superseded backend deployment.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy the published digest to Render
        if: steps.source.outputs.deploy == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_IMAGE: ${{ needs.publish.outputs.image }}
        run: python3 scripts/ci/render_deploy.py
