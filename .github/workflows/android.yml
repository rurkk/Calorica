name: Android CI

on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
      - '.github/workflows/release.yml'
      - 'scripts/ci/android_*'
      - 'scripts/ci/test_android_*'
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
      - '.github/workflows/release.yml'
      - 'scripts/ci/android_*'
      - 'scripts/ci/test_android_*'
      - '!**/*.md'

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.paths.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then BASE=$(git merge-base "$BASE" "$HEAD"); fi
          if [[ "$BASE" =~ ^0+$ ]]; then BASE=$(git hash-object -t tree /dev/null); fi
          python3 scripts/ci/component_changes.py "$BASE" "$HEAD"
      - name: Release automation regression tests
        run: python3 -m unittest discover -s scripts/ci -p 'test_android_*.py'
  verify:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v7
        id: apk
        with:
          name: calorica-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Debug build links
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          {
            echo "SHA: [$GITHUB_SHA]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)"
            echo "Workflow и логи: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Debug APK (GitHub artifact): $ARTIFACT_URL"
          } >> "$GITHUB_STEP_SUMMARY"
  release:
    needs: [changes, verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.android == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
