name: GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег выпуска, например v0.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:assembleDebug
      - name: Create prerelease with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ inputs.tag }}" app/build/outputs/apk/debug/app-debug.apk
          --title "Calorica ${{ inputs.tag }}" --prerelease
          --notes "Технический Android-каркас Calorica. Продуктовые функции ещё не реализованы. APK собран как debug и не предназначен для Google Play."
